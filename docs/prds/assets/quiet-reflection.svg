<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1000" viewBox="0 0 920 1000"><rect width="920" height="1000" fill="#E5E0D6"/><style>text{fill:#282C29;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.title{font-family:Georgia,serif;font-size:34px}.body{font-size:17px}.small{font-size:14px;fill:#586159}</style><text x="40" y="45" font-size="26">A little perspective</text><text x="40" y="75" class="small">Visual proposal · synthetic content · not an implemented app</text><g transform="translate(40,110)"><rect width="390" height="800" rx="34" fill="#F7F3EA"/><text x="26" y="36" class="small">9:41</text><path d="M330 24h25v12h-25z" fill="none" stroke="#282C29"/><text x="24" y="770" class="small">Begin</text><rect x="145" y="782" width="100" height="4" rx="2" fill="#282C29"/><text x="24" y="112" class="title">A little perspective</text><text x="24" y="151" class="body">One card. A moment for yourself.</text><rect x="99" y="207" width="192" height="300" rx="12" fill="#294C41"/><rect x="110" y="218" width="170" height="278" rx="6" fill="none" stroke="#C7B887"/><circle cx="195" cy="355" r="48" fill="none" stroke="#C7B887"/><path d="M195 291v128M131 355h128" stroke="#C7B887"/><circle cx="195" cy="355" r="7" fill="#C7B887"/><text x="24" y="560" font-size="22" font-family="Georgia">What could use your attention?</text><text x="24" y="594" class="body">Hold a question in mind, or simply</text><text x="24" y="620" class="body">see what the card brings up.</text><rect x="24" y="664" width="342" height="54" rx="14" fill="#294C41"/><text x="195" y="698" text-anchor="middle" style="fill:#FFFFFF;font-size:17px">Draw a card</text></g><g transform="translate(480,110)"><rect width="390" height="800" rx="34" fill="#F7F3EA"/><text x="26" y="36" class="small">9:41</text><path d="M330 24h25v12h-25z" fill="none" stroke="#282C29"/><text x="24" y="770" class="small">Reflect</text><rect x="145" y="782" width="100" height="4" rx="2" fill="#282C29"/><path d="M32 73l-8 8 8 8" fill="none" stroke="#294C41" stroke-width="2"/><text x="42" y="87" style="fill:#294C41;font-size:17px">Back</text><text x="195" y="87" text-anchor="middle" font-size="17">Your card</text><rect x="139" y="121" width="112" height="166" rx="8" fill="#E7DFCA"/><circle cx="195" cy="190" r="26" fill="none" stroke="#294C41" stroke-width="2"/><path d="M160 247h70M170 255h50" stroke="#294C41"/><text x="195" y="326" text-anchor="middle" class="title">The Star</text><text x="195" y="356" text-anchor="middle" class="small">Hope · renewal · possibility</text><path d="M24 386h342" stroke="#C9C6B8"/><text x="24" y="425" font-size="22">Make room for possibility</text><text x="24" y="460" class="body">You do not need the whole path</text><text x="24" y="486" class="body">mapped out. Notice one small thing</text><text x="24" y="512" class="body">that helps you feel more hopeful.</text><text x="24" y="570" font-size="22">Something to sit with</text><text x="24" y="606" class="body">What feels worth trying again?</text><rect x="24" y="664" width="342" height="54" rx="14" fill="#294C41"/><text x="195" y="698" text-anchor="middle" style="fill:#FFFFFF;font-size:17px">Finish reflection</text></g><text x="40" y="953" class="small">Card geometry is a placeholder. Final deck art and content need separate approval.</text></svg>